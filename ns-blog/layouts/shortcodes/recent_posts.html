<p class="recent-intro">here's a list of my most recent posts</p>
<ul class="recent-posts">
{{ range first 5 ((where .Site.Pages "IsPage" true).ByDate.Reverse) }}
<li>
  <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2 January 2006" }}</time>
  <a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a>
</li>
{{ end }}
</ul>
