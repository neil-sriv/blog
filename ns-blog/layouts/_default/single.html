{{ define "main" }}
<article class="post">
  {{ with .File }}
  <p class="cmd" aria-hidden="true"><span class="ps1">$</span> cat {{ .Path }}</p>
  {{ end }}
  <h1>{{ .Title }}</h1>
  <p class="byline">
    <time datetime="{{ .Date.Format "2006-01-02" }}">
      {{ .Date.Format (default "02 Jan, 2006" .Site.Params.dateFormat) }}
    </time>
  </p>
  <div class="wrapper">
    {{- partial "toc.html" . -}}
    <content>
      {{ .Content }}
    </content>
  </div>
  <p class="tag-row">
    {{ range (.GetTerms "tags") }}
    <a class="blog-tags" href="{{ .Permalink }}">#{{ lower .LinkTitle }}</a>
    {{ end }}
  </p>
</article>
{{ end }}
