{{ define "main" }}
<article>
  <header class="post-header">
    <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format (default "02 Jan, 2006" .Site.Params.dateFormat) }}</time>
    <h1>{{ .Title }}</h1>
    {{ with .GetTerms "tags" }}
    <p class="tag-row">
      {{ range . }}
      <a class="tag" href="{{ .RelPermalink }}">#{{ lower .LinkTitle }}</a>
      {{ end }}
    </p>
    {{ end }}
  </header>
  <div class="post-layout">
    <div class="prose">
      {{ .Content }}
    </div>
    {{- partial "toc.html" . -}}
  </div>
</article>
{{ end }}
