<small class="colophon">
  {{- $links := slice
    (dict "name" "bluesky" "label" "Bluesky" "href" "https://bsky.app/profile/neilsriv.tech")
    (dict "name" "github" "label" "GitHub" "href" "https://github.com/neil-sriv/")
  -}}
  {{- range $links }}
  <a class="social" href="{{ .href }}" target="_blank" rel="noopener noreferrer" aria-label="{{ .label }}">
    <span class="social-icon social-{{ .name }}" aria-hidden="true"></span>
  </a>
  {{- end }}
  <span class="colophon-credit">{{ with .Site.Params.madeWith }}{{ markdownify . }}{{ end }}</span>
</small>
