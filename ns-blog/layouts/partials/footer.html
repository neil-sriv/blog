<div class="colophon">
  <p class="colophon-links">
    {{- range $link := slice (dict "name" "bluesky" "href" "https://bsky.app/profile/neilsriv.tech") (dict "name" "github" "href" "https://github.com/neil-sriv/") }}
    <a href="{{ $link.href }}" target="_blank" rel="noopener noreferrer"><img src="{{ printf "/icons/%s.svg" $link.name | relURL }}" alt="{{ $link.name }}" width="16" height="16"></a>
    {{- end }}
    <a href="{{ "index.xml" | relURL }}">RSS</a>
  </p>
  <p class="colophon-note">{{ with .Site.Params.madeWith }}{{ markdownify . }}{{ end }}</p>
</div>
