<div class="footer-inner">
  <nav class="footer-social" aria-label="Social">
    {{ $links := slice (dict "name" "bluesky" "href" "https://bsky.app/profile/neilsriv.tech") (dict "name" "github" "href" "https://github.com/neil-sriv/") }}
    {{ range $links }}
    <a href="{{ .href }}" target="_blank" rel="noopener noreferrer">
      <img src="{{ printf "/icons/%s.svg" .name }}" alt="{{ .name }}" width="16" height="16">
    </a>
    {{ end }}
  </nav>
  <p class="footer-credit">{{ with .Site.Params.madeWith }}{{ markdownify . }}{{ end }}</p>
</div>
