{{ partialCached "pwa/assets/sw" . }}
{{ if .Page.Store.Get "hasMermaid" }}
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11.12.2/dist/mermaid.min.js" integrity="sha384-1ggI9FC3CkghppRD/XCR4aD+jp4DxwXlJIW0wxhyTLNKuiZEW3c4BwcjKXl0iVAJ" crossorigin="anonymous"></script>
  {{ partial "style/slot.html" (dict "name" "mermaid-theme" "page" . "bare" true) }}
  <script>
    (function () {
      var style = document.documentElement.getAttribute("data-style");
      var themes = window.blogMermaid || {};
      if (typeof themes[style] === "function") themes[style]();
      else mermaid.initialize({ startOnLoad: true, theme: "base" });
    })();
  </script>
{{ end }}
{{ partial "style/slot.html" (dict "name" "body-end" "page" . "bare" true) }}
