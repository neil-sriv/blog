<a href="{{ "" | relURL }}"{{ if .IsHome }} aria-current="page"{{ end }}><span class="nav-index">00</span><span class="nav-label">home</span><span class="nav-alt">index</span></a>
{{ range $i, $item := .Site.Menus.main }}
<a href="{{ $item.URL }}"{{ if or ($.IsMenuCurrent "main" $item) ($.HasMenuCurrent "main" $item) }} aria-current="page"{{ end }}><span class="nav-index">{{ printf "%02d" (add $i 1) }}</span><span class="nav-label">{{ lower $item.Name }}</span></a>
{{ end }}
