{{ $title := i18n "offline_title" }}
<!DOCTYPE html>
<html lang="{{ with .Site.LanguageCode }}{{ . }}{{ else }}en{{ end }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>{{- $title -}}</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #ffffff;
        --ink: #0a0a0a;
        --muted: #595959;
        --signal: #c4001d;
        --on-signal: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
          --bg: #0a0a0a;
          --ink: #f4f4f4;
          --muted: #a3a3a3;
          --signal: #ff4d4d;
          --on-signal: #0a0a0a;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0 auto;
        max-width: 70rem;
        min-height: 100vh;
        padding: 0 1.5rem 3rem;
        border-top: 0.5rem solid var(--signal);
        border-left: 1px solid var(--ink);
        border-right: 1px solid var(--ink);
        background: var(--bg);
        color: var(--ink);
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      }
      .kicker {
        margin: 2rem 0 0.5rem;
        color: var(--muted);
        font-size: 0.6875rem;
        font-weight: 500;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0 0 0.75rem;
        font-size: clamp(2.25rem, 5vw, 3.75rem);
        letter-spacing: -0.045em;
        line-height: 0.95;
      }
      .offline-info {
        max-width: 42ch;
        margin: 0 0 1.25rem;
        white-space: pre-line;
      }
      .offline-action {
        display: inline-block;
        margin: 0.5rem 0.5rem 0 0;
        padding: 0.6rem 0.9rem;
        border: 1px solid var(--ink);
        background: var(--ink);
        color: var(--bg);
        font-size: 0.6875rem;
        font-weight: 500;
        letter-spacing: 0.14em;
        text-decoration: none;
        text-transform: uppercase;
      }
      .offline-action:hover,
      .offline-action:focus-visible {
        border-color: var(--signal);
        background: var(--signal);
        color: var(--on-signal);
        outline: 2px solid var(--signal);
        outline-offset: 3px;
      }
      @media (prefers-reduced-motion: reduce) {
        .offline-action { transition: none; }
      }
    </style>
  </head>
  <body>
    <p class="kicker">Offline</p>
    <h1 class="offline-title">{{- $title -}}</h1>
    <div class="offline-info">{{ i18n "offline_info" | safeHTML }}</div>
    <div class="offline-actions">
      <a class="offline-action offline-action-home" href="{{ .Site.Home.RelPermalink }}">{{- i18n "home" -}}</a>
      <a class="offline-action offline-action-go-back" href="javascript: window.history.back();">{{- i18n "go_back" -}}</a>
      <a class="offline-action offline-action-try-again" href="javascript: window.location.reload();">{{- i18n "try_again" -}}</a>
    </div>
  </body>
</html>
