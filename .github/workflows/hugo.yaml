# Build the Hugo site and deploy it to GitHub Pages.
name: Deploy Hugo site to Pages

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install Hugo CLI
        env:
          HUGO_VERSION: "0.141.0"
          # hugo_extended_0.141.0_linux-amd64.deb from hugo_0.141.0_checksums.txt
          HUGO_SHA256: "5800e6286b6ed0d016318f026d5cbf745c8ced2cc3db17c5db9e41a32340e80b"
        run: |
          curl -fsSL -o "${{ runner.temp }}/hugo.deb" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          echo "${HUGO_SHA256}  ${{ runner.temp }}/hugo.deb" | sha256sum -c
          sudo dpkg -i "${{ runner.temp }}/hugo.deb"
          hugo version
      - name: Install Dart Sass
        env:
          DART_SASS_VERSION: "1.106.0"
          DART_SASS_SHA256: "4714f7d5c734b3a76ccf4024d79df41f754b65b3d6e90de2d038b4f3e1e7a604"
        run: |
          curl -fsSL -o "${{ runner.temp }}/dart-sass.tar.gz" \
            "https://github.com/sass/dart-sass/releases/download/${DART_SASS_VERSION}/dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz"
          echo "${DART_SASS_SHA256}  ${{ runner.temp }}/dart-sass.tar.gz" | sha256sum -c
          sudo tar -xzf "${{ runner.temp }}/dart-sass.tar.gz" -C /usr/local
          sudo ln -sf /usr/local/dart-sass/sass /usr/local/bin/sass
          sass --version
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
          TZ: America/Los_Angeles
        run: |
          cd ns-blog
          hugo mod get
          hugo \
            --gc \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ./ns-blog/public

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
